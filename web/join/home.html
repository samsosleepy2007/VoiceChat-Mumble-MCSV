<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Sleepy Voice Chat</title><link rel="stylesheet" href="/site.css"></head><body><header><div class="brand">SLEEPY VOICE CHAT</div><div id="account" class="account"><a title="ต้องเป็นสมาชิก Discord ของ SleepyMumla; หากยังไม่อยู่ ระบบจะขออนุญาตเข้าร่วมเซิร์ฟเวอร์" class="button discord-login" href="/api/auth/discord/login">เข้าสู่ระบบด้วย Discord</a><span class="account-user" hidden></span><button type="button" hidden>ออกจากระบบ</button></div></header><p id="auth-notice" class="auth-notice" role="status" hidden></p><main class="page"><section class="hero"><h1><span class="animated-title">SleepyMumla</span><br><span class="subtitle">Minecraft bedrock VoiceChat</span></h1><p>คุยเสียงกับเพื่อนในโลก Minecraft</p><a class="button primary download" href="/download">โหลด SleepyMumla <span aria-hidden="true">↗</span></a><a class="button install-link" href="/install">ติดตั้งระบบไมค์ <span aria-hidden="true">→</span></a><div class="price-panel" aria-label="ราคา"><div><small>ผู้เล่น</small><strong>ฟรี</strong><span>แอป + ลิงก์เข้าร่วม</span></div><div class="paid"><small>เจ้าของเซิร์ฟเวอร์</small><strong><span data-price>—</span> บาท</strong><span>จ่ายครั้งเดียวต่อเซิร์ฟเวอร์</span></div></div></section><section class="card"><h2>สร้างลิงก์เข้าร่วม</h2><form id="invite"><label for="address">ที่อยู่เซิร์ฟเวอร์</label><input id="address" placeholder="example.com:18655" required autocomplete="off" spellcheck="false"><label for="port">พอร์ต <span class="hint">(ไม่บังคับ)</span></label><input id="port" type="number" min="1" max="65535" placeholder="เช่น 18655"><button class="primary wide" type="submit">สร้างลิงก์ <span aria-hidden="true">→</span></button></form><div id="result" hidden><label for="link">ลิงก์สำหรับแชร์</label><input id="link" readonly><div class="result-actions"><button id="copy" type="button">คัดลอกลิงก์</button><a class="button" id="visit">เปิดหน้า Join</a></div></div><p id="status" role="status" aria-live="polite"></p></section></main><footer>Sleepy Voice Chat</footer><script src="/join.js"></script><script src="/home.js"></script><script src="/auth-ui.js"></script><script src="/pricing.js"></script><script src="/viewport.js"></script></body></html>
