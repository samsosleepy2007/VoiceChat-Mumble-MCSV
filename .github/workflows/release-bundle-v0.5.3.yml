name: Publish Sleepy Voice Chat v0.5.3
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-bundle-v0.5.3.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and build
        run: |
          python -m compileall -q src
          python tests/test_unified_contract.py
          cp addon/BP/scripts/main.js /tmp/mic.mjs
          node --check /tmp/mic.mjs
          python tools/build_itemmic_addon.py
          python -m pip install build
          python -m build --wheel
          mkdir out
          cp dist/endstone_mumble_host-0.5.3-py3-none-any.whl out/
          cp release-assets/VC_Mumble_ItemMic_v2.15.7_MicFix.mcaddon out/
          cp apps/vc-mumla/apk/VC-Mumla-v0.5-aec-debug.apk out/
          unzip -t out/VC_Mumble_ItemMic_v2.15.7_MicFix.mcaddon
          unzip -t out/VC-Mumla-v0.5-aec-debug.apk > /dev/null
          cd out
          sha256sum *.whl *.mcaddon *.apk > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.5.3 out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Sleepy Voice Chat v0.5.3 — Mic DDUI Fix" --notes-file release-notes/v0.5.3.md --latest
