name: SleepyMumla v0.6.9 main speaker only
on:
  push:
    branches: [fix/app-single-speaker]
    paths: [apps/vc-mumla/**, .github/workflows/build-sleepymumla-single-speaker.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;25.1.8937393"'
      - name: Build crypto libraries
        working-directory: apps/vc-mumla/source/libraries/humla/libs/humla-spongycastle
        run: |
          chmod +x ../../gradlew
          ../../gradlew jar --no-daemon
      - name: Run regression tests and build APK
        working-directory: apps/vc-mumla/source
        run: |
          python3 - <<'PYBUILD'
          from pathlib import Path
          p = Path('app/build.gradle')
          p.write_text(p.read_text().replace('applicationId "se.lublin.mumla.beta"', 'applicationId "se.lublin.mumla.webjoin"').replace('versionName gitDescribe', 'versionName "0.6.9"'))
          PYBUILD
          chmod +x gradlew
          ./gradlew :libraries:humla:testDebugUnitTest :app:testBetaDebugUnitTest :app:assembleBetaDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/beta/debug/*.apk "$GITHUB_WORKSPACE/out/SleepyMumla-v0.6.9.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$GITHUB_WORKSPACE/out/SleepyMumla-v0.6.9.apk" | tee "$GITHUB_WORKSPACE/out/APK-signature.txt"
          (cd "$GITHUB_WORKSPACE/out" && sha256sum *.apk > SHA256SUMS-v0.6.9.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SleepyMumla-v0.6.9
          path: |
            out/*
            apps/vc-mumla/source/libraries/humla/build/test-results/**/*.xml
            apps/vc-mumla/source/app/build/test-results/**/*.xml
      - name: Publish APK for device testing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sleepymumla-v0.6.9 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create sleepymumla-v0.6.9 out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'SleepyMumla v0.6.9 — Speaker fix cleanup' --notes 'Keeps the 0.6.8 Phone call mode (bottom speaker only). Volume buttons now follow Settings → Audio → Voice mode right away. On Android 12 and later the manual Bluetooth menu is hidden because Bluetooth headsets are picked automatically. Fixed a rare case where all incoming voice went silent until reconnecting after a decoder failed to start. Removed the unused output picker and handset-mode code. Debug build: uninstall the previous version first if Android refuses to update. Plugin and addon unchanged.' --prerelease
