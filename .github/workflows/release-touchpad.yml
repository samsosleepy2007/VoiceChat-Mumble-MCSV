name: Release SleepyBank Touchpad 2.15.43
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-touchpad.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and build addon
        run: |
          node --input-type=module --check < addon/BP/scripts/main.js
          for test in tests/test_touchpad.mjs tests/test_atm.mjs tests/test_atm_pin.mjs tests/test_bank.mjs tests/test_bank_ui.mjs tests/test_phone_lock.mjs; do node "$test"; done
          python3 tools/build_itemmic_addon.py
      - name: Prepare complete bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          gh release download sleepymumla-v0.6.3 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --pattern '*.whl' --dir out
          cp release-assets/VC_Mumble_ItemMic_v2.15.43_MicFix.mcaddon out/
          (cd out && sha256sum *.apk *.whl *.mcaddon > SHA256SUMS.txt)
      - name: Publish new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create addon-v2.15.43 out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'SleepyBank Touchpad v2.15.43' --notes-file release-notes/addon-v2.15.43.md --latest
