name: Build VC Proximity Mumble Linux

permissions:
  contents: write
# v0.3 proximity artifact

on:
  workflow_dispatch:
  push:
    branches: [main, feature/mcsv-proximity-v0.3, feature/phone-mic-4-block-test, feat/talking-indicator]

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[prox-build]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build pkg-config git python3 ca-certificates \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-qpa-plugins \
            libssl-dev libboost-dev libprotobuf-dev protobuf-compiler libprotoc-dev \
            libcap-dev libxi-dev libavahi-compat-libdnssd-dev libzeroc-ice-dev \
            libsqlite3-dev libmysqlclient-dev libpq-dev

      - name: Test SleepyPhone state and native routing
        run: |
          node tests/test_phone_calls.mjs
          g++ -std=c++17 -fPIC tests/test_call_routing.cpp mumble-patch/VCProximity.cpp -I mumble-patch $(pkg-config --cflags --libs Qt6Core) -o /tmp/test-call-routing
          /tmp/test-call-routing

      - name: Fetch Mumble 1.6.870
        run: |
          git clone --filter=tree:0 https://github.com/mumble-voip/mumble.git .build/mumble
          git -C .build/mumble checkout v1.6.870
          git -C .build/mumble submodule update --init --depth 1

      - name: Apply VC proximity patches
        run: |
          python3 tools/patch_mumble_linux.py \
            --source .build/mumble \
            --patch-dir mumble-patch

      - name: Configure server-only build
        run: |
          cmake -S .build/mumble -B .build/mumble-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_NUMBER=870 \
            -Dclient=OFF \
            -Dserver=ON \
            -Dice=OFF \
            -Dtests=OFF \
            -Dzeroconf=OFF \
            -Denable-mysql=OFF \
            -Denable-postgresql=OFF \
            -Dwarnings-as-errors=OFF \
            -Dtranslations=OFF \
            -Dplugins=OFF \
            -Doverlay=OFF \
            -Ddbus=OFF

      - name: Build custom server
        run: |
          cmake --build .build/mumble-build --target mumble-server -j 2
          test -x .build/mumble-build/mumble-server
          file .build/mumble-build/mumble-server
          ldd .build/mumble-build/mumble-server
          strings .build/mumble-build/mumble-server | grep -F call-direct
          strings .build/mumble-build/mumble-server | grep -F VC-PROX-FEED
          strings .build/mumble-build/mumble-server | grep -F VCG1 || true

      - name: Build proximity plugin wheel
        run: |
          mkdir -p src/endstone_mumble_host/bin out
          cp .build/mumble-build/mumble-server src/endstone_mumble_host/bin/mumble-server-vc
          chmod +x src/endstone_mumble_host/bin/mumble-server-vc
          python3 -m pip install --upgrade build
          rm -rf dist build *.egg-info
          python3 -m build --wheel
          python3 tools/build_itemmic_addon.py
          cp release-assets/VC_Mumble_ItemMic_v*_MicFix.mcaddon out/
          cp .build/mumble-build/mumble-server out/mumble-server-vc
          cp dist/*.whl out/
          chmod +x out/mumble-server-vc
          sha256sum out/mumble-server-vc out/*.whl > out/SHA256SUMS.txt
          unzip -l dist/*.whl | grep -F 'endstone_mumble_host/bin/mumble-server-vc'

      - uses: actions/upload-artifact@v4
        with:
          name: talking-indicator-test
          path: out/
          retention-days: 14

      - name: Save verified call-routing binary to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/endstone_mumble_host/bin/mumble-server-vc
          git diff --cached --quiet || git commit -m "Store verified SleepyPhone call-routing binary"
          git push origin HEAD:main
