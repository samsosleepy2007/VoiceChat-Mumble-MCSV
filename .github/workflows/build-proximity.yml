name: Build VC Proximity Mumble Linux

permissions:
  contents: write
# v0.5 SleepyPhone call-routing artifact

on:
  workflow_dispatch:
  push:
    branches: [main, feature/mcsv-proximity-v0.3, feature/sleepyphone-call-v0.5.0, feature/sleepyvoice-range-micoff-v0.5.1, fix/mic-failclosed-range-20260930]

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[prox-build]') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Test mute policy and patch routing against alternate audio contexts
        run: |
          python3 tests/test_unified_contract.py
          python3 tests/test_all_contexts_gate.py
          node --input-type=module --check < staging/ItemMic-v2.18.2-BP/scripts/main.js

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build pkg-config git python3 ca-certificates \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-qpa-plugins \
            libssl-dev libboost-dev libprotobuf-dev protobuf-compiler libprotoc-dev \
            libcap-dev libxi-dev libavahi-compat-libdnssd-dev libzeroc-ice-dev \
            libsqlite3-dev libmysqlclient-dev libpq-dev

      - name: Fetch Mumble 1.6.870
        run: |
          git clone --filter=tree:0 https://github.com/mumble-voip/mumble.git .build/mumble
          git -C .build/mumble checkout v1.6.870
          git -C .build/mumble submodule update --init --depth 1

      - name: Apply VC proximity patches
        run: |
          python3 tools/patch_mumble_linux.py \
            --source .build/mumble \
            --patch-dir mumble-patch

      - name: Configure server-only build
        run: |
          cmake -S .build/mumble -B .build/mumble-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_NUMBER=870 \
            -Dclient=OFF \
            -Dserver=ON \
            -Dice=OFF \
            -Dtests=OFF \
            -Dzeroconf=OFF \
            -Denable-mysql=OFF \
            -Denable-postgresql=OFF \
            -Dwarnings-as-errors=OFF \
            -Dtranslations=OFF \
            -Dplugins=OFF \
            -Doverlay=OFF \
            -Ddbus=OFF

      - name: Build custom server
        run: |
          cmake --build .build/mumble-build --target mumble-server -j 2
          test -x .build/mumble-build/mumble-server
          file .build/mumble-build/mumble-server
          ldd .build/mumble-build/mumble-server
          strings .build/mumble-build/mumble-server | grep -F VC-PROX-FEED
          strings .build/mumble-build/mumble-server | grep -F VCG1 || true
          strings .build/mumble-build/mumble-server | grep -F call-speaker
          strings .build/mumble-build/mumble-server | grep -F VC-PROX-MIC

      - name: Build proximity plugin wheel
        run: |
          mkdir -p src/endstone_mumble_host/bin out
          cp .build/mumble-build/mumble-server src/endstone_mumble_host/bin/mumble-server-vc
          chmod +x src/endstone_mumble_host/bin/mumble-server-vc
          python3 -m pip install --upgrade build
          rm -rf dist build *.egg-info
          python3 -m build --wheel
          cp .build/mumble-build/mumble-server out/mumble-server-vc
          cp dist/*.whl out/
          cp staging/SleepyVoiceChat-DDUI-hotfix-v2.18.2.mcaddon out/
          chmod +x out/mumble-server-vc
          sha256sum out/mumble-server-vc out/*.whl out/*.mcaddon > out/SHA256SUMS.txt
          unzip -l dist/*.whl | grep -F 'endstone_mumble_host/bin/mumble-server-vc'

      - uses: actions/upload-artifact@v4
        with:
          name: mumble-host-v0.5-call-routing
          path: out/
          retention-days: 14

      - name: Publish verified release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python3 - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )"
          cat > RELEASE_BODY.md <<'EOF'
          ## MumbleHost — MCSV proximity and SleepyPhone

          Builds a fresh, patched Mumble Server 1.6.870 and packages it with
          the Endstone plugin. All-context Minecraft Mic OFF is fail-closed;
          missing/stale player state cannot transmit voice.

          Assets:
          - Endstone plugin wheel (includes freshly compiled mumble-server-vc)
          - Standalone mumble-server-vc (Linux x86_64)
          - Item Mic v2.18.2 BP/RP DDUI-hotfix .mcaddon
          - SHA256SUMS.txt

          Upload the wheel into the MCSV /plugins folder and restart the server
          during maintenance. Test two players for Mic OFF and voice ranges
          10/20/30/60 before accepting this build as stable.
          EOF

          gh release create "v$VERSION" out/*.whl out/*.mcaddon out/mumble-server-vc out/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "MumbleHost v$VERSION" \
            --notes-file RELEASE_BODY.md

      - name: Publish test-only release candidate
        if: github.ref == 'refs/heads/fix/mic-failclosed-range-20260930' && contains(github.event.head_commit.message, '[release-rc]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.5.2-rc.1
          cat > RC_NOTES.md <<'EOF'
          ## Sleepy Voice Chat MumbleHost v0.5.2 release candidate

          **Testing build, not yet verified stable.**
          Freshly compiled Mumble Server 1.6.870 plus Endstone wheel and
          complete Item Mic v2.18.2 BP/RP DDUI hotfix.

          Changes:
          - fail-closed Mic OFF from Minecraft through Endstone and Mumble;
          - sender-level gate for normal speech, calls and alternate/whisper paths;
          - reject stale/invalid player state, restore range writer across restart;
          - suspend DDUI refresh while range slider is actively interactive;
          - range ACK timing diagnostics and MIC_LOCAL/MIC_STATE/VC-PROX-MIC logs.

          GitHub Actions native compilation and automated contract tests pass.
          Minecraft 1.26.51 has a separate vanilla_1.26.52 compatibility warning;
          it has **not** been patched by mislabeling vanilla assets.

          **Pending acceptance:** two-player test of distances 10/20/30/60,
          Mic OFF through proximity and SleepyPhone, repeated slider changes
          without a Bedrock/Endstone crash. No stable-main release until
          this acceptance test is observed.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/*.whl out/*.mcaddon out/mumble-server-vc out/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "Sleepy Voice Chat MumbleHost v0.5.2 RC1" \
              --notes-file RC_NOTES.md \
              --prerelease
          fi
