name: Release SleepyPhone v0.5.6
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-v0.5.6]'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y g++ pkg-config qt6-base-dev
      - name: Verify voice and phone flows
        run: |
          node --check addon/BP/scripts/main.js
          node tests/test_phone_calls.mjs
          node tests/test_contacts_ui.mjs
          node tests/test_phone_history.mjs
          python3 tests/test_phone_voice.py
          python3 tests/test_unified_contract.py
          g++ -std=c++17 -fPIC tests/test_call_routing.cpp mumble-patch/VCProximity.cpp -I mumble-patch $(pkg-config --cflags --libs Qt6Core) -o /tmp/test-call-routing
          /tmp/test-call-routing
      - name: Build packages
        run: |
          python3 -m pip install build
          python3 -m build --wheel
          python3 tools/build_itemmic_addon.py
          mkdir out
          cp dist/*.whl release-assets/VC_Mumble_ItemMic_v2.15.16_MicFix.mcaddon out/
      - name: Include existing VC Mumla client
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.5.3 --repo "$GITHUB_REPOSITORY" --pattern 'VC-Mumla-v0.5-aec-debug.apk' --dir out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && sha256sum *.whl *.mcaddon *.apk > SHA256SUMS.txt)
          gh release create v0.5.6 out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'v0.5.6 — SleepyPhone Chat & Faster DDUI' --notes-file release-notes/v0.5.6.md --latest
