name: Release MumbleHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: version
        run: |
          VERSION="$(python - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          print(data["project"]["version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Reuse verified VC proximity binary from v0.3.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/mumblehost-v03 src/endstone_mumble_host/bin
          gh release download v0.3.0 \
            --repo "${{ github.repository }}" \
            --pattern "endstone_mumble_host-0.3.0-py3-none-any.whl" \
            --dir /tmp/mumblehost-v03
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("/tmp/mumblehost-v03").glob("*.whl"))
          target = pathlib.Path("src/endstone_mumble_host/bin/mumble-server-vc")
          with zipfile.ZipFile(wheel) as zf:
              target.write_bytes(
                  zf.read("endstone_mumble_host/bin/mumble-server-vc")
              )
          target.chmod(0o755)
          print(target, target.stat().st_size)
          PY
          test -s src/endstone_mumble_host/bin/mumble-server-vc

      - name: Test unified MCSV plugin
        run: |
          python -m compileall -q src
          python tests/test_unified_contract.py

      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          rm -rf dist build *.egg-info
          python -m build --wheel
          sha256sum dist/*.whl | tee SHA256SUMS.txt

      - name: Verify release wheel
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("endstone_mumble_host-0.4.0-*.whl"))
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
          required = {
              "endstone_mumble_host/plugin.py",
              "endstone_mumble_host/host.py",
              "endstone_mumble_host/local_state.py",
              "endstone_mumble_host/listener.py",
              "endstone_mumble_host/model.py",
              "endstone_mumble_host/config.toml",
              "endstone_mumble_host/bin/mumble-server-vc",
          }
          missing = required - names
          assert not missing, missing
          assert "endstone_mumble_host/bridge_relay.py" not in names
          print(wheel)
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > RELEASE_BODY.md <<'EOF'
          ## MumbleHost v0.4.0 — Unified MCSV proximity voice

          One Endstone plugin now handles the complete MCSV-side system:
          - hosts Mumble Server 1.6.870 on port 18655,
          - reads Minecraft player position and dimension directly,
          - reads Item Mic ON/OFF state,
          - accepts Item Mic Voice Range request/ACK,
          - sends state only through localhost UDP 127.0.0.1:47855,
          - applies native proximity routing and smooth distance attenuation,
          - uses default attenuation level 3,
          - uses the Minecraft player name as the Mumble username.

          Android/mobile bridge, bridge secret, and the separate VC Mumble Endstone plugin are not required in this MCSV mode.

          ### Mumble welcome text

          Hosted by MCSV
          Plugin Mumble connate by SamSoSleepy
          Discord : https://discord.gg/FnmWw7nWyq

          ### Install

          Upload `endstone_mumble_host-0.4.0-py3-none-any.whl` to the MCSV Endstone `/plugins` directory and restart the server.

          The wheel includes the verified `mumble-server-vc` proximity binary.
          EOF

          gh release create "$TAG" dist/*.whl SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "MumbleHost $TAG" \
            --notes-file RELEASE_BODY.md
