name: Validate MumbleHost contract

on:
  push:
    branches: [main, feature/sleepyvoice-range-micoff-v0.5.1, fix/mic-failclosed-range-20260930]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Building a distributable wheel without a freshly patched Mumble binary
# is forbidden. Use build-proximity.yml for native compilation and packaging.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test unified MumbleHost
        run: |
          python -m compileall -q src
          python tests/test_unified_contract.py
          python tests/test_all_contexts_gate.py
          node --input-type=module --check < staging/ItemMic-v2.18.2-BP/scripts/main.js
