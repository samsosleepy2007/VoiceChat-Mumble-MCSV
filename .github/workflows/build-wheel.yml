name: Build MumbleHost wheel

on:
  push:
    branches:
      - main
      - experiment/unified-itemmic-proximity-v0.5.3
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and test unified plugin
        run: |
          python -m compileall -q src
          python tests/test_unified_contract.py

      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          rm -rf dist build *.egg-info
          python -m build --wheel

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("endstone_mumble_host-0.5.3-*.whl"))
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
          required = {
              "endstone_mumble_host/plugin.py",
              "endstone_mumble_host/host.py",
              "endstone_mumble_host/local_state.py",
              "endstone_mumble_host/listener.py",
              "endstone_mumble_host/model.py",
              "endstone_mumble_host/config.toml",
              "endstone_mumble_host/bin/mumble-server-vc",
          }
          missing = required - names
          assert not missing, missing
          assert "endstone_mumble_host/bridge_relay.py" not in names
          print(wheel)
          PY
          sha256sum dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: mumble-host-unified-v0.5.3
          path: dist/*.whl
          retention-days: 14
