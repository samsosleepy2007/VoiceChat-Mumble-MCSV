name: Attach Item Mic Addon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  attach-addon:
    if: contains(github.event.head_commit.message, '[attach-addon]')
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify Item Mic v2.9.0
        run: |
          BASE="https://github.com/samsosleepy2007/VoiceChat-Minecraft-bedrock-Mumble/releases/download/v0.6.0-beta.12"
          curl -fL -o VC_Mumble_ItemMic_v2.9.0.mcaddon "$BASE/VC_Mumble_ItemMic_v2.9.0.mcaddon"
          curl -fL -o upstream-SHA256SUMS.txt "$BASE/SHA256SUMS.txt"

          grep '  VC_Mumble_ItemMic_v2.9.0.mcaddon$' upstream-SHA256SUMS.txt > addon-SHA256.txt
          test -s addon-SHA256.txt
          sha256sum -c addon-SHA256.txt

      - name: Update v0.3.0 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.3.0 \
            --repo "${{ github.repository }}" \
            --pattern "endstone_mumble_host-0.3.0-py3-none-any.whl" \
            --dir .

          gh release delete-asset v0.3.0 VC_Mumble_ItemMic_v2.8.0.mcaddon \
            --repo "${{ github.repository }}" -y || true

          sha256sum \
            endstone_mumble_host-0.3.0-py3-none-any.whl \
            VC_Mumble_ItemMic_v2.9.0.mcaddon \
            > SHA256SUMS.txt

          gh release upload v0.3.0 \
            VC_Mumble_ItemMic_v2.9.0.mcaddon \
            SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --clobber
