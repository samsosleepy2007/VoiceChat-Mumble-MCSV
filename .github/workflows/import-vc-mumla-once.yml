name: Import VC Mumla client source and APK
on:
  push:
    branches: [main]
    paths: [".github/workflows/import-vc-mumla-once.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned client source and apply existing VC patch
        run: |
          set -eu
          test ! -e apps/vc-mumla
          git clone https://github.com/samsosleepy2007/VoiceChat-Minecraft-bedrock-Mumble.git /tmp/vc-original
          git -C /tmp/vc-original checkout 8ea9e038e5896eb61cca6cd606b1efbc9868607b
          mkdir -p apps/vc-mumla/scripts apps/vc-mumla/tests apps/vc-mumla/apk
          cp /tmp/vc-original/scripts/patch-mumla-vc-client.py apps/vc-mumla/scripts/
          cp /tmp/vc-original/tests/test_patch_mumla_vc_client.py apps/vc-mumla/tests/
          git clone https://github.com/quite/mumla.git apps/vc-mumla/source
          git -C apps/vc-mumla/source checkout 477b337ebcee1655c1357d51db99cf92bbc175a4
          rm -rf apps/vc-mumla/source/libraries/humla
          git clone https://github.com/quite/humla.git apps/vc-mumla/source/libraries/humla
          git -C apps/vc-mumla/source/libraries/humla checkout 7966f3828d6ed87ef29c517abfade6ad7998cdc5
          git -C apps/vc-mumla/source/libraries/humla submodule update --init --recursive
          python3 apps/vc-mumla/scripts/patch-mumla-vc-client.py --root apps/vc-mumla/source
          cd apps/vc-mumla
          python3 tests/test_patch_mumla_vc_client.py
          find source -name .git -type d -prune -exec rm -rf {} +
          find source -name .git -type f -delete
      - name: Copy published APK and verify SHA256
        run: |
          set -eu
          curl --fail --location --retry 3 --output apps/vc-mumla/apk/VC-Mumla-v0.5-aec-debug.apk https://github.com/samsosleepy2007/VoiceChat-Minecraft-bedrock-Mumble/releases/download/v0.6.0-beta.12/VC-Mumla-v0.5-aec-debug.apk
          cd apps/vc-mumla/apk
          echo "0535451d2fd1c8cc49b06bba788494118238ddd680707d9cd40bed84c8ab2152  VC-Mumla-v0.5-aec-debug.apk" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          unzip -t VC-Mumla-v0.5-aec-debug.apk >/dev/null
      - name: Document source provenance and build
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("apps/vc-mumla")
          provenance = {
              "source_repository": "https://github.com/samsosleepy2007/VoiceChat-Minecraft-bedrock-Mumble",
              "source_commit": "8ea9e038e5896eb61cca6cd606b1efbc9868607b",
              "mumla_commit": "477b337ebcee1655c1357d51db99cf92bbc175a4",
              "humla_commit": "7966f3828d6ed87ef29c517abfade6ad7998cdc5",
              "apk_release": "v0.6.0-beta.12",
              "apk_sha256": "0535451d2fd1c8cc49b06bba788494118238ddd680707d9cd40bed84c8ab2152",
              "note": "Published APK copied unchanged; source uses upstream pins with original VC patch."
          }
          (root / "PROVENANCE.json").write_text(json.dumps(provenance, indent=2) + "\n")
          (root / "README.md").write_text("""# VC Mumla client
          
          แอป VoiceChat สำหรับผู้เล่นที่เชื่อมต่อ Mumble บน MCSV.
          
          - APK: [VC-Mumla-v0.5-aec-debug.apk](apk/VC-Mumla-v0.5-aec-debug.apk)
          - Complete patched client source: [source/](source/)
          - VC customization: [scripts/patch-mumla-vc-client.py](scripts/patch-mumla-vc-client.py)
          - Origin and pinned revisions: [PROVENANCE.json](PROVENANCE.json)
          
          The published APK is copied unchanged. Keep upstream licenses alongside the source.
          
          ## Build
          
          Use Java 21, Android SDK 36 and NDK 25.1.8937393.
          
          ~~~sh
          cd apps/vc-mumla/source/libraries/humla/libs/humla-spongycastle
          chmod +x ../../gradlew
          ../../gradlew jar --no-daemon
          cd ../../../../..
          chmod +x gradlew
          ./gradlew :app:assembleBetaDebug --stacktrace --no-daemon
          ~~~
          
          ## Patch tests
          
          ~~~sh
          cd apps/vc-mumla
          python3 tests/test_patch_mumla_vc_client.py
          ~~~
          
          APK verification: run sha256sum -c SHA256SUMS.txt in apk/.
          """)
          readme = Path("README.md")
          readme.write_text(readme.read_text() + "\n## VC Mumla player app\n\nSource code and published Android APK: [apps/vc-mumla](apps/vc-mumla/README.md).\n")
          PY
      - name: Commit client files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/vc-mumla README.md
          git commit -m "Import VC Mumla player client sources and published v0.5 AEC APK"
          git push origin HEAD:main
