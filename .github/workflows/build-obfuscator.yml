name: Build protected addon and plugin
on:
  push:
    branches: [main, obfuscator-build]
    paths: [addon/**, LICENSE*, tools/build_obfuscated.py, tools/plugin_protection.py, tests/test_protected_plugin.py, tests/test_protected_addon.mjs, pyproject.toml, src/endstone_mumble_host/**, tools/obfuscation/**, .github/workflows/build-obfuscator.yml]
  workflow_dispatch:
concurrency:
  group: protected-distributions-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm ci --prefix tools/obfuscation --ignore-scripts --no-audit --no-fund
      - run: |
          for test in tests/test_{atm,atm_pin,bank,bank_ui,contacts_ui,deposit,mainhand_only,periodic_work,phone_calls,phone_history,phone_lock,range_preview,ringtone_preview,touchpad,transfer}.mjs; do node "$test"; done
      - run: python3 tools/build_obfuscated.py
      - run: node --input-type=module --check < obfuscator/addon/main.protected.js
      - run: node tools/obfuscation/verify.mjs
      - run: node tests/test_protected_addon.mjs
      - run: python3 tests/test_protected_plugin.py
      - name: Rebuild must be byte-identical
        run: cp obfuscator/SHA256SUMS.txt /tmp/sums && python3 tools/build_obfuscated.py && diff /tmp/sums obfuscator/SHA256SUMS.txt
      - name: Save protected distributions on this branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A obfuscator/addon obfuscator/plugin obfuscator/SHA256SUMS.txt web/join/lib/release.json
          git commit -m 'Build protected addon and plugin distributions' || exit 0
          git push origin "HEAD:${{ github.ref_name }}"
