name: Build VC Mumla web join
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-vc-webjoin]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;25.1.8937393"' 
      - name: Build crypto libraries
        working-directory: apps/vc-mumla/source/libraries/humla/libs/humla-spongycastle
        run: |
          chmod +x ../../gradlew
          ../../gradlew jar --no-daemon
      - name: Build APK
        working-directory: apps/vc-mumla/source
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleBetaDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/beta/debug/*.apk "$GITHUB_WORKSPACE/out/VC-Mumla-v0.6-webjoin-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: VC-Mumla-v0.6-webjoin
          path: out/*.apk
