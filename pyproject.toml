[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-mumble-host"
version = "0.6.0"
description = "Unified MCSV Mumble Server with Item Mic proximity routing"
requires-python = ">=3.11"
dependencies = ["endstone>=0.11.0"]

[project.entry-points."endstone"]
mumble_host = "endstone_mumble_host:MumbleHost"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
endstone_mumble_host = ["config.toml", "bin/mumble-server-vc"]
